spring.application.name=RegisterAndLoginWithSecurity
server.port=${PORT:8081}

# Database — uses env vars in production, falls back to localhost for dev
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/jwtexample3?createDatabaseIfNotExist=true}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Run data.sql after Hibernate DDL (fixes missing AUTO_INCREMENT on existing tables)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true


# SMTP Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
