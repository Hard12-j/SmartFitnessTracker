spring.application.name=RegisterAndLoginWithSecurity
server.port=${PORT:8081}

# Database — uses env vars in production, falls back to localhost for dev
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:mysql://localhost:3306/jwtexample3?createDatabaseIfNotExist=true}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Dialect is auto-detected — do NOT specify it explicitly (causes HHH90000025 deprecation warning)

# HikariCP — connection pool settings (helps with Aiven cold-start latency)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.maximum-pool-size=5

# Debug: log the resolved datasource URL at startup
logging.level.com.zaxxer.hikari=DEBUG
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG

# Run data.sql after Hibernate DDL (fixes missing AUTO_INCREMENT on existing tables)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true


# SMTP Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
