<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="'Chat with ' + ${otherUser.first}">Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- SockJS + STOMP -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f1724;
            --surface: rgba(255,255,255,0.05);
            --glass: rgba(255,255,255,0.08);
            --border: rgba(255,255,255,0.12);
            --primary: #6366f1;
            --primary-glow: rgba(99,102,241,0.35);
            --sent-bg: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --recv-bg: rgba(255,255,255,0.08);
            --text: #f1f5f9;
            --muted: #94a3b8;
            --online: #10b981;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Navbar ── */
        .navbar {
            background: rgba(15,23,36,0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 0.9rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-shrink: 0;
            z-index: 10;
        }

        .nav-back {
            color: var(--muted);
            text-decoration: none;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            padding: 0.4rem;
            border-radius: 0.5rem;
            transition: background 0.2s, color 0.2s;
        }
        .nav-back:hover { background: var(--glass); color: var(--text); }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.05rem;
            color: white;
            flex-shrink: 0;
            position: relative;
        }
        .avatar::after {
            content: '';
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 10px;
            height: 10px;
            background: var(--online);
            border-radius: 50%;
            border: 2px solid var(--bg);
        }

        .contact-info { flex: 1; }
        .contact-name { font-weight: 600; font-size: 1rem; }
        .contact-role { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

        /* ── Chat Body ── */
        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            scroll-behavior: smooth;
        }

        #chat-window::-webkit-scrollbar { width: 5px; }
        #chat-window::-webkit-scrollbar-track { background: transparent; }
        #chat-window::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        /* ── Day separator ── */
        .day-separator {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: var(--muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 0.5rem 0;
        }
        .day-separator::before, .day-separator::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ── Bubble ── */
        .bubble-row {
            display: flex;
            align-items: flex-end;
            gap: 0.6rem;
            max-width: 72%;
            animation: popIn 0.2s ease-out;
        }
        .bubble-row.sent { align-self: flex-end; flex-direction: row-reverse; }
        .bubble-row.received { align-self: flex-start; }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.92) translateY(6px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        .bubble-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }

        .bubble {
            padding: 0.65rem 1rem;
            border-radius: 1.2rem;
            line-height: 1.5;
            font-size: 0.95rem;
            word-break: break-word;
            position: relative;
            max-width: 100%;
        }

        .sent .bubble {
            background: var(--sent-bg);
            color: white;
            border-bottom-right-radius: 0.3rem;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .received .bubble {
            background: var(--recv-bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-bottom-left-radius: 0.3rem;
            backdrop-filter: blur(8px);
        }

        .bubble-meta {
            font-size: 0.7rem;
            color: var(--muted);
            margin-top: 0.3rem;
            text-align: right;
        }
        .sent .bubble-meta { text-align: right; }
        .received .bubble-meta { text-align: left; }

        /* ── Typing indicator ── */
        #typing-indicator {
            display: none;
            align-items: center;
            gap: 0.5rem;
            color: var(--muted);
            font-size: 0.85rem;
            padding: 0 0.5rem;
            animation: popIn 0.2s ease-out;
        }
        .dot-flashing {
            display: flex;
            gap: 3px;
        }
        .dot-flashing span {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--muted);
            animation: bounce 1.4s infinite ease-in-out;
        }
        .dot-flashing span:nth-child(2) { animation-delay: 0.2s; }
        .dot-flashing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }

        /* ── Empty state ── */
        #empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            gap: 1rem;
            text-align: center;
        }
        #empty-state i { font-size: 3rem; opacity: 0.3; }
        #empty-state p { font-size: 0.95rem; }

        /* ── Input bar ── */
        .input-bar {
            background: rgba(15,23,36,0.9);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--border);
            padding: 1rem 1.5rem;
            display: flex;
            gap: 0.75rem;
            align-items: flex-end;
            flex-shrink: 0;
        }

        #msg-input {
            flex: 1;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            color: var(--text);
            padding: 0.75rem 1.25rem;
            font-size: 0.95rem;
            font-family: 'Outfit', sans-serif;
            resize: none;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            max-height: 120px;
            line-height: 1.5;
        }
        #msg-input::placeholder { color: var(--muted); }
        #msg-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        #send-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.1rem;
            flex-shrink: 0;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 12px var(--primary-glow);
        }
        #send-btn:hover { transform: scale(1.08); box-shadow: 0 6px 18px var(--primary-glow); }
        #send-btn:active { transform: scale(0.96); }
        #send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        /* ── Connection badge ── */
        #conn-badge {
            position: fixed;
            top: 1rem;
            right: 1rem;
            padding: 0.3rem 0.75rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 600;
            z-index: 100;
            transition: all 0.3s;
        }
        .badge-connecting { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid rgba(245,158,11,0.3); }
        .badge-connected  { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
        .badge-error      { background: rgba(239,68,68,0.15);  color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
    </style>
</head>

<body>

<!-- Connection badge -->
<div id="conn-badge" class="badge-connecting">● Connecting…</div>

<!-- Navbar -->
<nav class="navbar">
    <a href="/welcome" class="nav-back"><i class="bi bi-arrow-left"></i></a>
    <div class="avatar" th:text="${#strings.substring(otherUser.first,0,1)}">T</div>
    <div class="contact-info">
        <div class="contact-name" th:text="${otherUser.first} + ' ' + ${otherUser.last}">Trainer Name</div>
        <div class="contact-role" th:text="${otherUser.role}">Trainer</div>
    </div>
</nav>

<!-- Chat window -->
<div id="chat-window">
    <div id="empty-state">
        <i class="bi bi-chat-dots"></i>
        <p>No messages yet.<br>Say hello! 👋</p>
    </div>
</div>

<!-- Typing indicator -->
<div id="typing-indicator" style="padding: 0.25rem 1.5rem; display: none; align-items: center; gap: 0.5rem; color: #94a3b8; font-size: 0.85rem;">
    <div class="dot-flashing">
        <span></span><span></span><span></span>
    </div>
    <span th:text="${otherUser.first} + ' is typing…'">typing…</span>
</div>

<!-- Input bar -->
<div class="input-bar">
    <textarea id="msg-input" rows="1" placeholder="Type a message…" maxlength="2000"></textarea>
    <button id="send-btn" disabled title="Send"><i class="bi bi-send-fill"></i></button>
</div>

<!-- Hidden model data -->
<div th:id="'data'"
     th:attr="data-current-id=${currentUser.id},
               data-other-id=${otherUser.id},
               data-room-id=${roomId},
               data-current-name=${currentUser.first},
               data-other-name=${otherUser.first}"
     style="display:none"></div>

<script>
    const data       = document.getElementById('data');
    const CURRENT_ID = parseInt(data.getAttribute('data-current-id'));
    const OTHER_ID   = parseInt(data.getAttribute('data-other-id'));
    const ROOM_ID    = data.getAttribute('data-room-id');
    const CURRENT_NAME = data.getAttribute('data-current-name');
    const OTHER_NAME   = data.getAttribute('data-other-name');

    const chatWindow = document.getElementById('chat-window');
    const input      = document.getElementById('msg-input');
    const sendBtn    = document.getElementById('send-btn');
    const badge      = document.getElementById('conn-badge');
    const emptyState = document.getElementById('empty-state');

    let stompClient = null;

    function formatTime(isoStr) {
        const d = new Date(isoStr);
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function formatDate(isoStr) {
        const d = new Date(isoStr);
        const today = new Date();
        const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
        if (d.toDateString() === today.toDateString()) return 'Today';
        if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
        return d.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function scrollToBottom(smooth = true) {
        chatWindow.scrollTo({ top: chatWindow.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
    }

    let lastDay = null;

    function appendMessage(msg, isSent, animate = true) {
        if (emptyState) emptyState.style.display = 'none';

        const sentAt = msg.sentAt || new Date().toISOString();
        const day = formatDate(sentAt);

        if (day !== lastDay) {
            const sep = document.createElement('div');
            sep.className = 'day-separator';
            sep.textContent = day;
            chatWindow.appendChild(sep);
            lastDay = day;
        }

        const row = document.createElement('div');
        row.className = 'bubble-row ' + (isSent ? 'sent' : 'received');
        if (!animate) row.style.animation = 'none';

        const avatarInitial = isSent ? CURRENT_NAME.charAt(0) : OTHER_NAME.charAt(0);
        const avatarEl = document.createElement('div');
        avatarEl.className = 'bubble-avatar';
        avatarEl.textContent = avatarInitial;

        const innerDiv = document.createElement('div');
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = msg.content;

        const meta = document.createElement('div');
        meta.className = 'bubble-meta';
        meta.textContent = formatTime(sentAt);

        innerDiv.appendChild(bubble);
        innerDiv.appendChild(meta);

        if (isSent) {
            row.appendChild(innerDiv);
            row.appendChild(avatarEl);
        } else {
            row.appendChild(avatarEl);
            row.appendChild(innerDiv);
        }

        chatWindow.appendChild(row);
        scrollToBottom(!animate);
    }

    // Load history
    fetch('/chat/history/' + ROOM_ID)
        .then(r => r.json())
        .then(messages => {
            messages.forEach(m => {
                appendMessage(m, m.senderId === CURRENT_ID, false);
            });
            scrollToBottom(false);
        })
        .catch(() => {});

    // WebSocket connection
    function connect() {
        badge.textContent = '● Connecting…';
        badge.className = 'badge-connecting';

        const sock = new SockJS('/ws');
        stompClient = Stomp.over(sock);
        stompClient.debug = null; // silence debug logs

        stompClient.connect({}, function () {
            badge.textContent = '● Connected';
            badge.className = 'badge-connected';
            sendBtn.disabled = false;

            // Fade out badge after 3s
            setTimeout(() => { badge.style.opacity = '0'; }, 3000);
            setTimeout(() => { badge.style.display = 'none'; }, 3300);

            stompClient.subscribe('/topic/chat/' + ROOM_ID, function (frame) {
                const msg = JSON.parse(frame.body);
                const isSent = msg.senderId === CURRENT_ID;
                appendMessage(msg, isSent);
            });

        }, function () {
            badge.textContent = '● Disconnected';
            badge.className = 'badge-error';
            badge.style.opacity = '1';
            badge.style.display = 'block';
            sendBtn.disabled = true;
            // Reconnect after 3s
            setTimeout(connect, 3000);
        });
    }

    connect();

    // Send message
    function sendMessage() {
        const text = input.value.trim();
        if (!text || !stompClient || !stompClient.connected) return;

        const msg = {
            senderId: CURRENT_ID,
            receiverId: OTHER_ID,
            content: text
        };

        stompClient.send('/app/chat.send', {}, JSON.stringify(msg));
        input.value = '';
        input.style.height = 'auto';
    }

    sendBtn.addEventListener('click', sendMessage);

    input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // Auto-resize textarea
    input.addEventListener('input', function () {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });
</script>

</body>
</html>
